name: ci

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run psr --fixtures prepare
      - run: uv run psr --fixtures index
      - run: uv run psr --fixtures eval --systems bm25 --split test
      # `psr --fixtures train` and the ltr eval smoke step are added in P3.

  terraform:
    runs-on: ubuntu-latest
    if: hashFiles('deploy/terraform/aws/*.tf') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=deploy/terraform/aws fmt -check
      - run: terraform -chdir=deploy/terraform/aws init -backend=false
      - run: terraform -chdir=deploy/terraform/aws validate
