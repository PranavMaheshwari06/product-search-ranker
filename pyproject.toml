[project]
name = "product-search-ranker"
version = "0.1.0"
description = "Product search ranking on the ESCI dataset, with an LLM-judge agreement study"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb",
    "pyarrow",
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "bm25s",
    "lightgbm",
    "mlflow",
    "httpx",
    "pydantic",
    "matplotlib",
    "fastapi",
    "uvicorn",
    "prometheus-client",
    "mangum",
    "boto3",
    "torch>=2.15.0",
    "sentence-transformers>=6.2.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[project.scripts]
psr = "product_search_ranker.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
