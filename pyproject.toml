[project]
name = "product-search-ranker"
version = "0.1.0"
description = "Product search ranking on the ESCI dataset, with an LLM-judge agreement study"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb",
    "pyarrow",
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "bm25s",
    "lightgbm",
    "mlflow",
    "httpx",
    "pydantic",
    "matplotlib",
    "fastapi",
    "uvicorn",
    "prometheus-client",
    "mangum",
    "boto3",
]

[dependency-groups]
dev = ["pytest", "ruff"]
# torch comes from one of two groups: gpu (local, default) or cpu (CI, Docker, Lambda).
gpu = ["torch>=2.15.0", "sentence-transformers>=6.2.0"]
cpu = ["torch>=2.15.0", "sentence-transformers>=6.2.0"]

[project.scripts]
psr = "product_search_ranker.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "gpu"]
environments = ["sys_platform == 'linux'"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu132", group = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
